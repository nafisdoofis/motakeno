name: Build and Release MotaKeno APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        working-directory: ./android
        run: gradle assembleDebug

      - name: Prepare APK File for Download
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/MotaKeno.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotaKeno-Android-APK
          path: release-assets/MotaKeno.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "MotaKeno v1.0.0 Release"
          body: |
            ## MotaKeno - Calorie Tracker & Target BMI Planner (Android APK)

            ### Features in this Release:
            - **320 Verified Foods**: Authentic Bangladeshi staples, fish, vegetables, fast foods, cheeses, sauces, and drinks.
            - **Target BMI & Deficit Planner**: Mifflin-St Jeor daily calorie budget calculation.
            - **Custom Recipe Calculator**: Raw-to-cooked batch weight and calorie-per-gram calculation.
            - **Low-Calorie Recipe Finder**: Instant meal suggestions matching what you have in the fridge.
            - **100% On-Device Storage**: Zero external servers, all tracking stays private on your phone.
            - **Universal Screen Fit**: Optimized for any Android screen size.

            ### Installation:
            1. Download `MotaKeno.apk` below directly to your Android device.
            2. Tap to install (enable "Install from unknown sources" or your browser permission if prompted).
          files: release-assets/MotaKeno.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
