name: Build HisabFit BD Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Pinned Gradle version: the project has no gradle wrapper, and AGP 8.2.2
      # needs Gradle 8.2+ but breaks on very new Gradle majors.
      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        working-directory: ./android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HisabFit-BD-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
